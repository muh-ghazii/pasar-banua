# Blueprint Render (paket gratis). Database MySQL disediakan di luar Render
# (mis. TiDB Cloud Serverless atau Aiven for MySQL, keduanya punya paket gratis).
services:
  - type: web
    name: pasar-banua
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Pasar Banua
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # isi dengan hasil `php artisan key:generate --show`
      - key: APP_URL
        sync: false # mis. https://pasar-banua.onrender.com
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: id
      - key: APP_FAKER_LOCALE
        value: id_ID
      - key: APP_TIMEZONE
        value: Asia/Makassar
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TiDB Cloud memakai CA publik; Aiven: kosongkan ini dan isi DB_SSL_CA_PEM dengan isi ca.pem.
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log
      - key: PASARBANUA_DEMO_DATA
        value: "true"
      - key: PASARBANUA_SHIPPING_FLAT
        value: "12000"
